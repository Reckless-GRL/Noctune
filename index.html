<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My YouTube Music Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Верхняя панель (Header) -->
    <header class="header">
        <div class="logo">MyMusic</div>
        <div class="search-bar">
            <input type="text" placeholder="Введите запрос...">
        </div>
        <div class="profile">👤</div>
    </header>

    <div class="main-container">
        <!-- Боковое меню (Sidebar) -->
        <aside class="sidebar">
            <nav>
                <a href="#" class="nav-item active">🏠 Главная</a>
                <a href="#" class="nav-item">🧭 Навигатор</a>
                <a href="#" class="nav-item">📚 Библиотека</a>
            </nav>
        </aside>

        <!-- Основной контент (Main Content) -->
        <main class="content">
            <section class="section">
                <h2>Быстрый выбор</h2>
                <div class="grid-container">
                    <div class="card">
                        <div class="card-image"></div>
                        <div class="card-title">Любимый трек</div>
                    </div>
                    <div class="card">
                        <div class="card-image"></div>
                        <div class="card-title">Плейлист для кодинга</div>
                    </div>
                    <div class="card">
                        <div class="card-image"></div>
                        <div class="card-title">Энергичный рок</div>
                    </div>
                    <div class="card">
                        <div class="card-image"></div>
                        <div class="card-title">Новинки</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Нижний плеер (Player Bar) -->
    <footer class="player-bar">
        <div class="track-info">
            <div class="mini-cover"></div>
            <div>
                <div class="track-name">Название трека</div>
                <div class="track-artist">Исполнитель</div>
            </div>
        </div>
        <div class="player-controls">
            <button class="control-btn">⏮</button>
            <button class="control-btn play">▶</button>
            <button class="control-btn">⏭</button>
        </div>
        <div class="volume-controls">
            🔊 <input type="range" class="volume-slider">
        </div>
    </footer>

</body>
</html>
